name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
          echo "BACKEND_PORT=${{ secrets.BACKEND_PORT }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}" >> .env
          echo "FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}" >> .env
          echo "API_URL=${{ secrets.API_URL }}" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "."
          target: "${{ secrets.VPS_DEPLOY_PATH || '/opt/dossierhub' }}"
          strip_components: 0
          exclude: |
            .git
            .github
            node_modules
            .angular
            dist
            *.log
            .DS_Store

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH || '/opt/dossierhub' }}
            
            # Stop existing containers
            docker-compose down || true
            
            # Pull latest images (if using registry)
            # docker-compose pull || true
            
            # Build and start containers
            docker-compose build --no-cache
            docker-compose up -d
            
            # Clean up old images
            docker image prune -f
            
            # Show running containers
            docker-compose ps

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            echo "Waiting for services to be healthy..."
            sleep 10
            
            # Check backend health
            curl -f http://localhost:${{ secrets.BACKEND_PORT || 3000 }}/api/health || exit 1
            
            # Check frontend health
            curl -f http://localhost:${{ secrets.FRONTEND_PORT || 80 }}/health || exit 1
            
            echo "✅ All services are healthy!"

